emoryTitle"></h2><p id="memoryDesc"></p><button id="continue">Back to our drive ♥</button></div></div></div><script>
const scenes=[{time:'6:45 AM',img:'assets/scene01.jpg',title:'A softer kind of morning',desc:'A slow start, a warm cuddle, and waking up together.',x:340,y:330},{time:'7:00 AM',img:'assets/scene02.jpg',title:'Wordle, side by side',desc:'Two minds, one puzzle, and a little friendly competition.',x:570,y:250},{time:'7:30 AM',img:'assets/scene03.jpg',title:'Our silly little jokes',desc:'Sending reels, laughing at DMs, and teasing from room to room.',x:820,y:350},{time:'8:00 AM',img:'assets/scene04.jpg',title:'A view worth sharing',desc:'A quiet moment together, watching the lake from the balcony.',x:1050,y:240},{time:'8:15 AM',img:'assets/scene05.jpg',title:'Tea &amp; breakfast',desc:'A little breakfast date before the day gets busy.',x:1280,y:370},{time:'9:30 AM',img:'assets/scene06.jpg',title:'Getting ready',desc:'He irons her outfit while she gets ready for the office.',x:1510,y:260},{time:'10:20 AM',img:'assets/scene07.jpg',title:'One last bye',desc:'Walking her to the Innova cab and waving goodbye.',x:1750,y:390},{time:'12:00 PM',img:'assets/scene08.jpg',title:'Home office hours',desc:'Back home, laptop open, and the workday begins.',x:1960,y:570},{time:'1:00 PM',img:'assets/scene09.jpg',title:'Little check-ins',desc:'A few messages between tasks: “How’s work?” and “When are you back?”',x:1770,y:760},{time:'6:00 PM',img:'assets/scene10.jpg',title:'The best welcome home',desc:'She’s back, and he welcomes her with the biggest hug.',x:1510,y:900},{time:'7:30 PM',img:'assets/scene11.jpg',title:'One more call',desc:'She’s done for the day; he’s wrapping up while she waits for their time.',x:1250,y:760},{time:'7:45 PM',img:'assets/scene12.jpg',title:'A little reset together',desc:'Logging off and sharing a sweet, private shower-time moment.',x:980,y:960},{time:'8:00 PM',img:'assets/scene13.jpg',title:'Dinner dates, even on ordinary days',desc:'Chicken noodles, parotta, Sprite, and each other.',x:710,y:800},{time:'10:00 PM',img:'assets/scene14.jpg',title:'Just us time',desc:'Reels, games, laughter, and stretching the night a little longer.',x:470,y:1030},{time:'11:00 PM',img:'assets/scene15.jpg',title:'Before the next good morning',desc:'A forehead kiss, sleepy cuddles, and one more request for company.',x:260,y:820}];const world=document.getElementById('world'),car=document.getElementById('car'),viewport=document.getElementById('viewport'),modal=document.getElementById('modal');const stops=[...document.querySelectorAll('.stop')];let x=270,y=330,angle=0,speed=0,keys={},found=new Set(),active=0,last=0,paused=false,clockBase=405;const mapW=2300,mapH=1500;const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));function camera(){const vw=viewport.clientWidth,vh=viewport.clientHeight;const tx=clamp(vw/2-x,-(mapW-vw),0),ty=clamp(vh/2-y,-(mapH-vh),0);world.style.transform=`translate(${tx}px,${ty}px)`;car.style.left=x+'px';car.style.top=y+'px';car.style.transform=`translate(-50%,-50%) rotate(${angle}deg)`}function setClock(i){document.getElementById('clock').textContent=scenes[i]?.time||'11:00 PM';document.getElementById('count').textContent=found.size+' / 15'}function openScene(i){if(found.has(i))return;document.getElementById('memoryImg').style.display='block';found.add(i);active=i;const s=scenes[i];setClock(i);stops[i].classList.add('found');stops[i].classList.remove('next');document.getElementById('memoryImg').src=s.img;document.getElementById('memoryTitle').textContent=s.title;document.getElementById('memoryTime').textContent=s.time+' · MEMORY '+(i+1)+' OF 15';document.getElementById('memoryDesc').textContent=s.desc;modal.classList.add('show');paused=true;roses();const next=stops[i+1];if(next)next.classList.add('next')}function closeScene(){modal.classList.remove('show');paused=false;keys={};document.getElementById('memoryImg').style.display='block';}function roses(){for(let i=0;i<16;i++){let r=document.createElement('span');r.className='rose';r.textContent=i%3===0?'🌹':(i%2?'🌸':'♡');r.style.left=(15+Math.random()*70)+'vw';r.style.top=(55+Math.random()*35)+'vh';r.style.setProperty('--dx',(Math.random()*220-110)+'px');r.style.animationDelay=(Math.random()*.6)+'s';document.body.appendChild(r);setTimeout(()=>r.remove(),3500)}}function tick(t){const dt=Math.min((t-last)/16.67||1,2);last=t;if(!paused){let dx=0,dy=0;if(keys.ArrowUp||keys.w||keys.W)dy-=1;if(keys.ArrowDown||keys.s||keys.S)dy+=1;if(keys.ArrowLeft||keys.a||keys.A)dx-=1;if(keys.ArrowRight||keys.d||keys.D)dx+=1;if(dx||dy){const mag=Math.hypot(dx,dy);dx/=mag;dy/=mag;x=clamp(x+dx*3.6*dt,50,mapW-50);y=clamp(y+dy*3.6*dt,100,mapH-50);angle=Math.atan2(dy,dx)*180/Math.PI+90;car.classList.toggle('bounce',Math.floor(t/110)%2===0);camera();for(let i=0;i<scenes.length;i++){if(!found.has(i)){let s=scenes[i],d=Math.hypot(x-s.x,y-s.y);if(d<65){openScene(i);break}}}}}requestAnimationFrame(tick)}window.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();if(e.key==='Escape'&&modal.classList.contains('show'))closeScene();keys[e.key]=true});window.addEventListener('keyup',e=>keys[e.key]=false);window.addEventListener('blur',()=>keys={});document.getElementById('close').onclick=closeScene;document.getElementById('continue').onclick=closeScene;modal.addEventListener('click',e=>{if(e.target===modal)closeScene()});document.getElementById('reset').onclick=()=>{found.clear();stops.forEach(s=>s.classList.remove('found','next'));stops[0].classList.add('next');x=270;y=330;paused=false;setClock(0);camera();closeScene()};document.getElementById('help').onclick=()=>{document.getElementById('memoryImg').removeAttribute('src');document.getElementById('memoryTime').textContent='YOUR LITTLE ADVENTURE';document.getElementById('memoryTitle').textContent='Let’s go for a drive!';document.getElementById('memoryDesc').textContent='Use the arrow keys or W A S D to drive anywhere around the map. Visit each heart pin to unlock a memory from your day together. Find all 15 moments, from 6:45 AM to 11:00 PM. You can explore freely between stops.';modal.classList.add('show');paused=true;document.getElementById('memoryImg').style.display='none';document.getElementById('continue').onclick=()=>{document.getElementById('memoryImg').style.display='block';closeScene();document.getElementById('continue').onclick=closeScene}};stops.forEach((s,i)=>s.addEventListener('click',()=>{let el=scenes[i];x=el.x;y=el.y;camera();openScene(i)}));stops[0].classList.add('next');setClock(0);camera();requestAnimationFrame(tick);window.addEventListener('resize',camera);
